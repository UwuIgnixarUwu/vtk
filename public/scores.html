<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ұпайлар таблосы</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; text-align: center; margin: 0; }
        .container { max-width: 700px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        h1 { color: #333; margin-bottom: 30px; }
        
        .scores-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .score-card { background: #f8f9fc; border-radius: 10px; padding: 20px; box-shadow: inset 0 0 0 1px #e3e6f0; }
        .score-card.smart { border-bottom: 4px solid #4e73df; }
        .score-card.edu { border-bottom: 4px solid #1cc88a; }
        .score-card.creative { border-bottom: 4px solid #f6c23e; }
        
        .team-title { font-size: 16px; font-weight: bold; color: #5a5c69; margin-bottom: 10px; }
        .score-number { font-size: 48px; font-weight: 800; color: #2e59d9; }
        
        .btn-summary { background: #1cc88a; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-summary:hover { background: #17a673; }
        
        #chart-container { margin-top: 40px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 Командалар ұпайы</h1>

    <div class="scores-grid">
        <div class="score-card smart">
            <div class="team-title">SmartTeam</div>
            <div class="score-number" id="score-SmartTeam">0</div>
        </div>
        <div class="score-card edu">
            <div class="team-title">EduTeam</div>
            <div class="score-number" id="score-EduTeam" style="color: #1cc88a;">0</div>
        </div>
        <div class="score-card creative">
            <div class="team-title">CreativeTeam</div>
            <div class="score-number" id="score-CreativeTeam" style="color: #f6c23e;">0</div>
        </div>
    </div>

    <button class="btn-summary" onclick="showChart()">Сабақ қорытындысын шығару</button>

    <div id="chart-container">
        <h3>Сабақ қорытындысы (Дөңгелек диаграмма)</h3>
        <canvas id="myChart"></canvas>
    </div>

    <br><br>
    <a href="/" style="color: #4e73df; text-decoration: none;">← Басты бетке оралу</a>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let currentScores = { SmartTeam: 0, EduTeam: 0, CreativeTeam: 0 };
    let chartInstance = null;

    socket.on('update-scores', (scores) => {
        currentScores = scores;
        document.getElementById('score-SmartTeam').innerText = scores.SmartTeam || 0;
        document.getElementById('score-EduTeam').innerText = scores.EduTeam || 0;
        document.getElementById('score-CreativeTeam').innerText = scores.CreativeTeam || 0;
        
        if (chartInstance) {
            updateChartData();
        }
    });

    function showChart() {
        document.getElementById('chart-container').style.display = 'block';
        const ctx = document.getElementById('myChart').getContext('2d');
        
        if (chartInstance) {
            chartInstance.destroy();
        }

        chartInstance = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: ['SmartTeam', 'EduTeam', 'CreativeTeam'],
                datasets: [{
                    data: [currentScores.SmartTeam, currentScores.EduTeam, currentScores.CreativeTeam],
                    backgroundColor: ['#4e73df', '#1cc88a', '#f6c23e']
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { position: 'bottom' } }
            }
        });
    }

    function updateChartData() {
        chartInstance.data.datasets[0].data = [currentScores.SmartTeam, currentScores.EduTeam, currentScores.CreativeTeam];
        chartInstance.update();
    }
</script>
</body>
</html>
