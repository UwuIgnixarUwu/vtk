<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Бағалау және Ұпайлар</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 25px; text-align: center; margin: 0; font-size: 18px; }
        .container { max-width: 950px; margin: 20px auto; background: white; padding: 35px; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        h1 { color: #2c3e50; margin-bottom: 5px; font-size: 32px; }
        .subtitle { color: #7f8c8d; margin-bottom: 30px; font-size: 19px; }
        .scores-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 35px; }
        .score-card { background: #f8f9fc; border-radius: 12px; padding: 20px; border-bottom: 5px solid #4e73df; }
        .score-number { font-size: 52px; font-weight: 800; color: #2e59d9; margin-top: 5px; }
        .work-link { font-size: 15px; color: #4e73df; margin-top: 8px; word-break: break-all; }
        
        .ai-section { background: #f1f5f9; padding: 25px; border-radius: 12px; margin-top: 35px; text-align: left; }
        .ai-title { font-size: 24px; font-weight: bold; color: #1e293b; margin-bottom: 20px; text-align: center; }
        
        table.ai-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        table.ai-table th, table.ai-table td { padding: 14px 10px; text-align: center; border-bottom: 1px solid #e2e8f0; font-size: 16px; }
        table.ai-table th { background: #3b82f6; color: white; font-size: 17px; }
        
        .btn-ai { background: #8b5cf6; color: white; border: none; padding: 12px 22px; border-radius: 8px; font-weight: bold; cursor: pointer; display: block; margin: 10px auto; font-size: 16px; }
        .btn-ai:disabled { background: #cbd5e1; cursor: not-allowed; }
        
        .loader { display: none; color: #8b5cf6; font-weight: bold; text-align: center; margin: 12px 0; font-size: 18px; }

        .btn-summary { background: #1cc88a; color: white; border: none; padding: 16px 32px; font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 30px; }
        #winner-box { display: none; margin-top: 30px; background: #fef3c7; border: 2px dashed #f59e0b; padding: 25px; border-radius: 12px; font-size: 26px; font-weight: bold; color: #b45309; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 ИИ Оқыту және Бағалау Таблосы</h1>
    <div class="subtitle">Командалық жұмыстарды цифрлық әділ қазылар алқасы (ИИ) арқылы бағалау</div>

    <div class="scores-grid">
        <div class="score-card" style="border-bottom-color:#4e73df;">
            <div style="font-weight:bold; font-size:22px;">SmartTeam</div>
            <div class="work-link" id="site-SmartTeam"></div>
            <div class="score-number" id="score-SmartTeam">0</div>
        </div>
        <div class="score-card" style="border-bottom-color:#1cc88a;">
            <div style="font-weight:bold; font-size:22px;">EduTeam</div>
            <div class="work-link" id="site-EduTeam"></div>
            <div class="score-number" id="score-EduTeam" style="color:#1cc88a;">0</div>
        </div>
        <div class="score-card" style="border-bottom-color:#f6c23e;">
            <div style="font-weight:bold; font-size:22px;">CreativeTeam</div>
            <div class="work-link" id="site-CreativeTeam"></div>
            <div class="score-number" id="score-CreativeTeam" style="color:#f6c23e;">0</div>
        </div>
    </div>

    <div class="ai-section">
        <div class="ai-title">🤖 Цифрлық ИИ Әділ Қазылар Бағалауы (0-5 баллы)</div>
        <div id="ai-tables-container"></div>
    </div>

    <button class="btn-summary" onclick="showSummary()">Сабақ қорытындысын шығару</button>

    <div id="winner-box"></div>

    <div id="chart-container" style="display:none; margin-top: 35px;">
        <h3>Жалпы ұпайлар диаграммасы</h3>
        <canvas id="myChart"></canvas>
    </div>

    <br><br>
    <a href="/" style="color: #4e73df; text-decoration: none; font-size: 18px;">← Басты бетке оралу</a>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let globalTeams = {};
    let chartInstance = null;
    let evaluatingTeam = null;

    socket.on('update-teams', (teams) => {
        globalTeams = teams;
        renderScores(teams);
        renderAiTables(teams);
        if (chartInstance) updateChartData();
    });

    function renderScores(teams) {
        for (let t in teams) {
            document.getElementById(`score-${t}`).innerText = teams[t].score;
            document.getElementById(`site-${t}`).innerHTML = teams[t].workUrl ? `<a href="${teams[t].workUrl}" target="_blank">Жұмысты ашу ↗</a>` : '<span style="color:#e74a3b;">Жұмыс жоқ</span>';
        }
    }

    function renderAiTables(teams) {
        const container = document.getElementById('ai-tables-container');
        container.innerHTML = '';

        for (let t in teams) {
            const data = teams[t];
            const c = data.aiCriteria;
            const isEvaluating = evaluatingTeam === t;

            container.innerHTML += `
                <div style="background:white; padding:18px; border-radius:10px; margin-bottom:20px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <strong style="font-size:20px;">${t} ${data.workUrl ? `(<a href="${data.workUrl}" target="_blank">Жұмысы</a>)` : '(<span style="color:#e74a3b;">Жұмыс жоқ</span>)'}</strong>
                        <button class="btn-ai" ${data.aiEvaluated || isEvaluating ? 'disabled' : ''} onclick="startAiEvaluation('${t}')">
                            ${data.aiEvaluated ? 'Бағаланды ✅' : (isEvaluating ? 'ИИ талдауда... ⏳' : 'Жұмысты бағалау 🤖')}
                        </button>
                    </div>
                    ${isEvaluating ? '<div class="loader" style="display:block;">🤖 Жұмыс талдануда... 15-20 сек күтіңіз...</div>' : ''}
                    <table class="ai-table">
                        <thead>
                            <tr>
                                <th>Функционал</th>
                                <th>Дизайн</th>
                                <th>Код сапасы</th>
                                <th>Промт</th>
                                <th>Қорғау</th>
                                <th>Жалпы ИИ балы</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>${c.functional} / 5</td>
                                <td>${c.design} / 5</td>
                                <td>${c.codeQuality} / 5</td>
                                <td>${c.prompt} / 5</td>
                                <td>${c.defense} / 5</td>
                                <td style="font-weight:bold; color:#8b5cf6; font-size:18px;">${data.aiTotal} баллы</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
        }
    }

    function startAiEvaluation(team) {
        evaluatingTeam = team;
        socket.emit('start-ai-evaluation', team);
        renderAiTables(globalTeams);
        setTimeout(() => {
            evaluatingTeam = null;
            renderAiTables(globalTeams);
        }, 18000);
    }

    function showSummary() {
        document.getElementById('chart-container').style.display = 'block';
        const winnerBox = document.getElementById('winner-box');
        
        let maxScore = -1;
        let winner = '';
        for (let t in globalTeams) {
            if (globalTeams[t].score > maxScore) {
                maxScore = globalTeams[t].score;
                winner = t;
            }
        }

        winnerBox.style.display = 'block';
        winnerBox.innerHTML = `🎉 Жеңімпаз команда: <u>${winner}</u> (${maxScore} ұпай)! 🏆`;

        const ctx = document.getElementById('myChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: ['SmartTeam', 'EduTeam', 'CreativeTeam'],
                datasets: [{
                    data: [globalTeams.SmartTeam.score, globalTeams.EduTeam.score, globalTeams.CreativeTeam.score],
                    backgroundColor: ['#4e73df', '#1cc88a', '#f6c23e']
                }]
            },
            options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { font: { size: 16 } } } } }
        });
    }

    function updateChartData() {
        chartInstance.data.datasets[0].data = [globalTeams.SmartTeam.score, globalTeams.EduTeam.score, globalTeams.CreativeTeam.score];
        chartInstance.update();
    }
</script>
</body>
</html>
