<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Студентті тіркеу</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f7f6; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; background: #fff; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #218838; }
        label { font-size: 14px; color: #555; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Тіркелу</h2>
        <form action="/api/register" method="POST">
            <label for="firstName">Аты:</label>
            <input type="text" id="firstName" name="firstName" placeholder="Атыңызды енгізіңіз" required>
            
            <label for="lastName">Тегі:</label>
            <input type="text" id="lastName" name="lastName" placeholder="Тегіңізді енгізіңіз" required>

            <label for="team">Команданы таңдаңыз:</label>
            <select id="team" name="team" required>
                <option value="" disabled selected>Команданы таңдау...</option>
                <option value="1">1-ші Команда</option>
                <option value="2">2-ші Команда</option>
            </select>

            <button type="submit">Тіркелу</button>
        </form>
    </div>
</body>
</html>
