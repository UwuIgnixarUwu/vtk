<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Студентті тіркеу</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f7f6; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Тіркелу</h2>
        <form action="/api/register" method="POST">
            <input type="text" name="firstName" placeholder="Сіздің атыңыз" required>
            <input type="text" name="lastName" placeholder="Сіздің тегіңіз" required>
            <select name="team" required>
                <option value="" disabled selected>Команданы таңдаңыз</option>
                <option value="Alfa">Alfa</option>
                <option value="Beta">Beta</option>
                <option value="CreativeTeam">CreativeTeam</option>
            </select>
            <button type="submit">Тіркелу</button>
        </form>
    </div>
</body>
</html>
