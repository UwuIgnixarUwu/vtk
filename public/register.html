<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тіркелу</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f2f5; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 380px; text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; padding: 12px; background: #1cc88a; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-add { background: #4e73df; font-size: 18px; padding: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="form-box">
            <h2>Қатысушыны тіркеу</h2>
            <input type="text" id="firstName" placeholder="Атыңыз" required>
            <input type="text" id="lastName" placeholder="Тегіңіз" required>
            <select id="team" required>
                <option value="" disabled selected>Команданы таңдаңыз</option>
                <option value="SmartTeam">SmartTeam</option>
                <option value="EduTeam">EduTeam</option>
                <option value="CreativeTeam">CreativeTeam</option>
            </select>
            <input type="url" id="siteUrl" placeholder="Жоба/Сайт сілтемесі (http://...)">
            <button onclick="submitForm()">Тіркелу</button>
        </div>

        <div id="registered-box" style="display: none;">
            <h2>Сіз тіркелдіңіз!</h2>
            <p>Сәлем, <strong id="user-name"></strong>!</p>
            <p>Командаңыз: <strong id="user-team" style="color:#4e73df; font-size:18px;"></strong></p>
            <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">
            <p style="font-size: 14px;">Командаңызға +1 ұпай қосу:</p>
            <button class="btn-add" onclick="addScore()">+1 Ұпай өз командама!</button>
            <p id="msg" style="color: #1cc88a; font-weight: bold; display: none; margin-top: 10px;">Ұпай қосылды! 🎉</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myTeam = null;

        function submitForm() {
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const team = document.getElementById('team').value;
            const siteUrl = document.getElementById('siteUrl').value.trim();

            if (firstName && lastName && team) {
                socket.emit('register-student', { firstName, lastName, team, siteUrl });
            } else {
                alert('Өтініш, міндетті өрістерді толтырыңыз!');
            }
        }

        socket.on('registration-success', (student) => {
            myTeam = student.team;
            document.getElementById('form-box').style.display = 'none';
            document.getElementById('registered-box').style.display = 'block';
            document.getElementById('user-name').innerText = `${student.firstName} ${student.lastName}`;
            document.getElementById('user-team').innerText = student.team;
        });

        function addScore() {
            if (myTeam) {
                socket.emit('add-score', myTeam);
                const msg = document.getElementById('msg');
                msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 2000);
            }
        }
    </script>
</body>
</html>
