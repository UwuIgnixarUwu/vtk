<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Басты бет - Командалар</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; min-height: 100vh; margin: 0; background: #f0f2f5; font-size: 18px; }
        .left { flex: 2; padding: 35px; overflow-y: auto; }
        .right { flex: 1; background: white; padding: 35px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-left: 1px solid #e0e0e0; }
        h1 { color: #1a1a1a; margin-bottom: 30px; font-size: 32px; }
        h3 { font-size: 22px; }
        .teams-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 25px; }
        .team-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); border-top: 6px solid #007bff; }
        .team-card.smart { border-top-color: #4e73df; }
        .team-card.edu { border-top-color: #1cc88a; }
        .team-card.creative { border-top-color: #f6c23e; }
        .team-card h2 { margin: 0; font-size: 24px; text-align: center; }
        .work-link { text-align: center; margin: 12px 0 18px 0; font-size: 16px; }
        .work-link a { color: #4e73df; font-weight: bold; text-decoration: none; word-break: break-all; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 6px; font-size: 17px; border-bottom: 1px solid #f0f0f0; }
        th { color: #666; font-size: 18px; }
        .btn-link { display: inline-block; margin-top: 25px; padding: 16px 26px; background: #4e73df; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 18px; }
        .admin-link { margin-top: 20px; color: #858796; text-decoration: none; font-size: 15px; }
        @media (max-width: 900px) { body { flex-direction: column; } .right { border-left: none; border-top: 1px solid #ddd; } }
    </style>
</head>
<body>
    <div class="left">
        <h1>Командалар бойынша қатысушылар</h1>
        <div class="teams-grid">
            <div class="team-card smart">
                <h2>🚀 SmartTeam</h2>
                <div class="work-link" id="link-SmartTeam">Жұмыс сілтемесі: <i>Жұмыс жоқ</i></div>
                <table><thead><tr><th>№</th><th>Аты-жөні</th></tr></thead><tbody id="list-SmartTeam"></tbody></table>
            </div>
            <div class="team-card edu">
                <h2>📚 EduTeam</h2>
                <div class="work-link" id="link-EduTeam">Жұмыс сілтемесі: <i>Жұмыс жоқ</i></div>
                <table><thead><tr><th>№</th><th>Аты-жөні</th></tr></thead><tbody id="list-EduTeam"></tbody></table>
            </div>
            <div class="team-card creative">
                <h2>🎨 CreativeTeam</h2>
                <div class="work-link" id="link-CreativeTeam">Жұмыс сілтемесі: <i>Жұмыс жоқ</i></div>
                <table><thead><tr><th>№</th><th>Аты-жөні</th></tr></thead><tbody id="list-CreativeTeam"></tbody></table>
            </div>
        </div>
    </div>
    <div class="right">
        <h3>Тіркелу үшін сканерлеңіз:</h3>
        <div id="qrcode">QR-код жүктелуде...</div>
        <p id="url-text" style="font-size: 13px; color: #777; word-break: break-all; text-align: center; margin-top: 12px;"></p>
        <a class="btn-link" href="/scores.html">🏆 Ұпайлар мен ИИ Бағалау</a>
        <a class="admin-link" href="/admin.html" target="_blank">Администратор панелі</a>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        fetch('/api/qrcode').then(res => res.json()).then(data => {
            document.getElementById('qrcode').innerHTML = `<img src="${data.qrImage}" width="200">`;
            document.getElementById('url-text').innerText = data.registerUrl;
        });

        socket.on('update-teams', (teams) => {
            for (let t in teams) {
                const el = document.getElementById(`link-${t}`);
                if (teams[t].workUrl) {
                    el.innerHTML = `Жұмыс сілтемесі: <a href="${teams[t].workUrl}" target="_blank">Жұмысты ашу ↗</a>`;
                } else {
                    el.innerHTML = `Жұмыс сілтемесі: <i style="color:#e74a3b;">Жұмыс жоқ</i>`;
                }
            }
        });

        socket.on('update-students', (students) => {
            ['SmartTeam', 'EduTeam', 'CreativeTeam'].forEach(team => {
                const tbody = document.getElementById(`list-${team}`);
                const list = students.filter(s => s.team === team);
                tbody.innerHTML = list.length === 0 ? '<tr><td colspan="2" style="color:#aaa; text-align:center;">Қатысушылар жоқ</td></tr>' : '';
                list.forEach((s, i) => {
                    tbody.innerHTML += `<tr><td>${i + 1}</td><td>${s.firstName} ${s.lastName}</td></tr>`;
                });
            });
        });
    </script>
</body>
</html>
